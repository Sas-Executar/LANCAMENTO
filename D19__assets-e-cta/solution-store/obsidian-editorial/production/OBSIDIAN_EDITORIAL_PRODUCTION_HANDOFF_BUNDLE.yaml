  handoff_id: "HANDOFF-OBS-EDITORIAL-001"
  submission_id: "STORE-OBS-EDITORIAL-001"
  generated_from_repository: "Sas-Executar/LANCAMENTO"
  source_branch: "feat/d19-taxonomy-release-handoff"
  source_commit: "c0ec0799a35e7696689eb92b33da5a8925d97408"
  solution_id: "SOL-OBS-EDITORIAL-001"
  solution_version: "1.3.0"
  production_id: "VID-OBS-EDITORIAL-001"
  super_schema_version: "1.3"
  taxonomy_version: "1.1"
  purpose: >-
    Snapshot autocontido para produção, divulgação e submissão na loja de ferramentas.
  canonical_sources:
    super_schema: "D19__assets-e-cta/solution-store/SUPER_SCHEMA_SOLUTION.yaml"
    solution: "D19__assets-e-cta/solution-store/obsidian-editorial/solution.yaml"
    production: "D19__assets-e-cta/solution-store/obsidian-editorial/VIDEO_PRODUCTION.yaml"
    production_handoff_schema: "D19__assets-e-cta/solution-store/PRODUCTION_HANDOFF_SCHEMA.yaml"
    store_submission_schema: "D19__assets-e-cta/solution-store/STORE_SUBMISSION_SCHEMA.yaml"
    areas: "D19__assets-e-cta/solution-store/taxonomy/AREAS.yaml"
    professions: "D19__assets-e-cta/solution-store/taxonomy/PROFESSIONS.yaml"
    task_types: "D19__assets-e-cta/solution-store/taxonomy/TASK_TYPES.yaml"
    artifact_types: "D19__assets-e-cta/solution-store/taxonomy/ARTIFACT_TYPES.yaml"
    tagging_rules: "D19__assets-e-cta/solution-store/taxonomy/TAGGING_RULES.yaml"

handoff:
  status:
    build_ready: true
    render_ready: true
    store_submission_ready: true
    publish_ready: false
    state: "READY_FOR_BUILD_AND_STORE_SUBMISSION_BLOCKED_FOR_PUBLISH"
  objective: >-
    Produzir e divulgar o Obsidian Editorial, mantendo rastreabilidade entre solução,
    evidências, taxonomia, assets comerciais, listing e publicação.
  classification_snapshot:
    primary_area: "productivity"
    secondary_areas: ["research", "operations"]
    primary_professions: ["project_manager", "researcher", "student", "teacher"]
    related_professions: ["lawyer", "accountant", "product_manager", "software_developer"]
    task_types: ["organize", "structure", "document", "transform", "knowledge_management"]
    artifact_types: ["markdown_document", "project_documentation", "knowledge_base", "briefing"]
  primary_output:
    type: "video"
    duration_seconds: 20
    aspect_ratio: "9:16"
    resolution_px: [1080, 1920]
    fps: 30
    format: "mp4"
    total_frames: 600
  variants:
    - {id: "MASTER-9X16", aspect_ratio: "9:16", resolution_px: [1080, 1920], audio: true}
    - {id: "VAR-16X9", aspect_ratio: "16:9", resolution_px: [1920, 1080], audio: true}
    - {id: "VAR-1X1", aspect_ratio: "1:1", resolution_px: [1080, 1080], audio: true}
    - {id: "VAR-9X16-MUTE", aspect_ratio: "9:16", resolution_px: [1080, 1920], audio: false}
  asset_manifest:
    required:
      - {id: "dados_ficticios_lancamento_produto_x", type: "mock_content", status: "DEFINED"}
      - {id: "estrutura_exemplo_lancamento_produto_x", type: "mock_structure", status: "DEFINED"}
      - {id: "system-ui", type: "font_stack", status: "AVAILABLE"}
    pending:
      - {id: "PENDING_LICENSED_TRACK", type: "music", status: "BLOCKER_FOR_PUBLISH"}
      - {id: "PENDING_PUBLIC_TOOL_URL", type: "cta_destination", status: "BLOCKER_FOR_PUBLISH"}
  claim_control:
    allowed:
      - "Transforma conteúdo bruto em documentação Markdown estruturada e navegável."
      - "O caso demonstrado converte briefing disperso em base operacional."
      - "A estrutura pode ser continuada e atualizada."
    prohibited_without_new_evidence:
      - "Percentuais de economia de tempo."
      - "Percentuais de redução de carga cognitiva."
      - "Alegações de eficácia clínica ou tratamento de TDAH."
      - "Métricas de produtividade, conversão ou confiabilidade ainda não medidas."
  timeline_contract:
    time_source: "frame_index"
    formula: "t = frame / fps"
    wall_clock_allowed: false
    set_interval_allowed: false
    scroll_driven_render_allowed: false
    scenes:
      - {id: "C01", start_s: 0, end_s: 3.5, frame_start: 0, frame_end: 104, frame_count: 105}
      - {id: "C02", start_s: 3.5, end_s: 7.5, frame_start: 105, frame_end: 224, frame_count: 120}
      - {id: "C03", start_s: 7.5, end_s: 12.5, frame_start: 225, frame_end: 374, frame_count: 150}
      - {id: "C04", start_s: 12.5, end_s: 16, frame_start: 375, frame_end: 479, frame_count: 105}
      - {id: "C05", start_s: 16, end_s: 20, frame_start: 480, frame_end: 599, frame_count: 120}
    checks:
      scene_duration_sum_seconds: 20
      frame_count_sum: 600
      no_timeline_gaps: true
      no_timeline_overlaps: true
  implementation_contract:
    technique: "HTML_CSS_JS"
    render_pipeline: "browser_frames + ffmpeg_or_equivalent_encoder"
    state_model: "pure_function_of_time"
    accessibility:
      captions_required: true
      reduced_motion_for_web: true
      message_must_work_without_audio: true
  creative_contract:
    tone: "sofisticado, didático e preciso"
    pacing: "moderado com aceleração na transformação"
    visual_priority: ["roteiro", "tipografia", "composição", "ritmo", "áudio", "efeitos"]
  qa_acceptance:
    required:
      - "Mensagem compreensível sem áudio."
      - "Texto legível em tela de celular."
      - "Nenhum corte, sobreposição ou overflow."
      - "Nenhum dado pessoal ou claim sem evidência."
      - "Áudio sincronizado e sem distorção."
      - "CTA permanece legível por tempo suficiente."
      - "Cada quadro deriva de t = frame / fps."
      - "Render não depende de setInterval, scroll ou relógio de parede."
  publication_blockers:
    - "Confirmar URL pública definitiva do CTA."
    - "Selecionar trilha/efeitos e confirmar licenças."
    - "Concluir aprovação final do listing e assets."
  handoff_exit:
    build_team_can_start: true
    store_team_can_prepare_listing: true
    publication_requires_additional_approval: true
    next_owner: "Motion/Front-end production + Store operations"

