  solution_name: "Obsidian Editorial"
  slug: "obsidian-editorial"
  solution_type: "AI_SKILL"
  category: "Knowledge Management"
  version: "1.2.0"
  source_file_ref: "obsidian-editorial.skill"

public_layer:
  problem_statement: >-
    Informações brutas e dispersas exigem esforço manual para virar documentação
    consistente, navegável e reutilizável no Obsidian.
  target_user: "Usuários de Obsidian que organizam conhecimento, projetos e documentação."
  three_p_n_three:
    problema_que_resolve: >-
      Reduz o trabalho de transformar notas, briefings, decisões, tarefas e referências
      dispersas em documentação estruturada.
    processo_aplicado: >-
      Recebe conteúdo, interpreta o objetivo, aplica uma estrutura editorial,
      organiza a saída em Markdown e valida consistência estrutural.
    progresso_pretendido: >-
      Converter informação não estruturada em uma base navegável, persistente e
      reutilizável no Obsidian.
    next:
      "01": "Fornecer o conteúdo bruto."
      "02": "Definir o resultado ou formato desejado."
      "03": "Executar a transformação e validar a saída."
  tutorial:
    title: "Obsidian Editorial — de conteúdo bruto para documentação estruturada"
    introduction: >-
      Use a ferramenta quando você tiver conteúdo útil, mas ainda sem arquitetura
      clara para utilização contínua no Obsidian.
    instructions:
      - "Cole ou anexe o conteúdo que deseja organizar."
      - "Descreva o resultado desejado ou selecione o perfil de saída."
      - "Execute a transformação e incorpore a estrutura validada ao vault."
    expected_result: "Markdown estruturado, navegável e pronto para continuidade."
  practical_example:
    title: "De briefing caótico para documentação operacional"
    scenario: >-
      Um projeto de lançamento possui prazo, tarefas, responsáveis, concorrentes,
      reuniões e referências misturados em uma única nota.
    input_example: |-
      Projeto: Lançamento Produto X
      - lançamento previsto para novembro
      - definir landing page
      - João cuida do design
      - falta confirmar orçamento
      - concorrentes: A, B e C
      - reunião sexta
      - pesquisar estratégia de SEO
      - campanha precisa estar pronta antes do dia 15
      - referência: campanha anterior
    transformation: >-
      Separar contexto, objetivos, decisões, tarefas, pesquisa e referências em uma
      arquitetura documental coerente.
    output_example: |-
      LANCAMENTO-PRODUTO-X/
      ├── 00_INDEX.md
      ├── 01_CONTEXT.md
      ├── 02_OBJECTIVES.md
      ├── 03_DECISIONS.md
      ├── 04_TASKS.md
      ├── 05_RESEARCH.md
      └── 06_REFERENCES.md
    before_state: "Informação dispersa e difícil de reutilizar."
    after_state: "Base operacional navegável e atualizável."
    why_it_shines: >-
      A ferramenta demonstra maior valor quando precisa converter conteúdo heterogêneo
      e desestruturado em uma arquitetura persistente sem exigir organização manual prévia.

capability_contract:
  process_applied: "Análise do conteúdo → estrutura editorial → Markdown → validação."
  intended_progress: "Base Markdown organizada e reutilizável."
  hero_use_case: "Briefing disperso → sistema documental operacional no Obsidian."
  input_required:
    - "texto"
    - "markdown"
    - "documentos"
    - "notas"
  output_generated:
    - "markdown estruturado"
    - "documentação navegável"
  dependencies:
    - "Obsidian para uso final da estrutura"
  limitations:
    - "Não valida automaticamente a veracidade factual do conteúdo-fonte."
    - "Não constitui intervenção clínica, diagnóstico ou tratamento."

