evidence_matrix_18:
  schema_version: "1.0"
  row_id: "OBS-EDITORIAL-TDAH-PM-001"
  funcoes_fundamentais_gestao_projetos: >-
    Planejar, organizar, executar, monitorar e controlar entregas, escopo,
    comunicação e trabalho associado ao projeto.
  funcoes_executivas_area_gestao_projetos: >-
    Priorizar, decompor trabalho, sequenciar ações, manter contexto,
    acompanhar estado e concluir tarefas.
  capacidades_humanas_operacionais_exigidas: >-
    Atenção sustentada, memória de trabalho, planejamento, organização,
    controle inibitório, gestão do tempo e retomada de contexto.
  funcao_deficit_tdah: >-
    Vulnerabilidades possíveis em memória de trabalho, inibição, vigilância,
    planejamento e organização; não presentes de forma idêntica em todas as pessoas.
  fonte_clinica:
    title: "NIMH — Attention-Deficit/Hyperactivity Disorder: What You Need to Know"
    url: "https://www.nimh.nih.gov/health/publications/attention-deficit-hyperactivity-disorder-what-you-need-to-know"
  fonte_cientifica:
    title: "Willcutt et al. — Validity of the executive function theory of ADHD: a meta-analytic review"
    url: "https://pubmed.ncbi.nlm.nih.gov/15950006/"
  funcao_executiva_cognitiva: >-
    Planejamento/organização, memória de trabalho, inibição e atenção sustentada.
  evidencia: >-
    A literatura identifica diferenças médias em funções executivas associadas ao TDAH
    e evidência de benefício para estratégias estruturadas de organização e planejamento.
  impacto_operacional_funcao_afetada: >-
    Planejamento, priorização, acompanhamento, retomada e conclusão de projetos.
  impacto_operacional_mecanismo: >-
    Alta dependência de memória interna e autorregulação pode aumentar perda de contexto,
    esquecimento e dificuldade de sequenciamento.
  impacto_operacional_consequencia: >-
    Pode contribuir para procrastinação, tarefas esquecidas, fragmentação do projeto,
    dificuldade de retomada e de finalização.
  impacto_operacional_compensacao: >-
    Externalizar contexto, estado, próxima ação, estrutura, evidência e critérios de
    conclusão em documentação persistente.
  conclusao_produto_design: >-
    O design da ferramenta deve reduzir carga operacional ao converter conteúdo em
    estrutura navegável, passos limitados, checkpoints e informação persistente.
  classe_epistemica: "EVIDENCIA_CLINICA_INDIRETA + INFERENCIA_DE_DESIGN"
  estado_validacao: "VALIDADO_PARCIALMENTE"
  observacoes: >-
    A associação entre TDAH e funções executivas possui suporte científico, porém a
    eficácia clínica específica do Obsidian Editorial não foi testada.

