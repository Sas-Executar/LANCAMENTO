usage_fit:
  best_use_cases:
    - id: "BUC-01"
      title: "Briefing disperso para base operacional"
      problem: "Contexto, decisões, tarefas e referências estão misturados e difíceis de retomar."
      scenario: "Projeto com múltiplas notas, responsáveis, prazos e referências ainda sem arquitetura documental."
      why_this_tool: "Converte conteúdo heterogêneo em estrutura persistente e navegável."
      expected_gain: "Menos organização manual e menor perda de contexto entre sessões."
      fit_conditions:
        - "Há volume suficiente de informação para justificar estrutura."
        - "O conteúdo será reutilizado ou atualizado."
      evidence_refs:
        - "TC-OBS-001"
    - id: "BUC-02"
      title: "Pesquisa extensa para base de conhecimento"
      problem: "Fontes, achados e notas de pesquisa acumulam-se sem navegação consistente."
      scenario: "Pesquisa com múltiplos documentos que precisa virar notas conectadas, sínteses e referências."
      why_this_tool: "Ajuda a separar tipos de informação e manter uma arquitetura editorial estável."
      expected_gain: "Melhor recuperabilidade e continuidade da pesquisa."
      fit_conditions:
        - "Existem várias fontes ou blocos de conteúdo."
        - "O usuário precisa continuar adicionando material."
      evidence_refs: []
    - id: "BUC-03"
      title: "Processo recorrente para documentação reutilizável"
      problem: "Um fluxo recorrente é documentado de formas diferentes a cada execução."
      scenario: "SOP, checklist, template ou pacote operacional que precisa manter padrão entre ciclos."
      why_this_tool: "Padroniza a saída e reduz decisões repetidas de estrutura e formatação."
      expected_gain: "Maior consistência documental e menor retrabalho editorial."
      fit_conditions:
        - "A tarefa se repete."
        - "Existe valor em padronização entre execuções."
      evidence_refs: []
  risk_of_use:
    - id: "RISK-01"
      scenario: "Nota curta, descartável ou de uso único."
      failure_mode: "A estrutura gerada adiciona mais etapas do que a tarefa exige."
      overkill_reason: "O custo de organizar supera o benefício de reutilização."
      better_alternative: "Criar ou editar diretamente uma nota simples."
      severity: "LOW"
      likelihood: "MEDIUM"
      mitigation: "Aplicar fit gate e recomendar fluxo simples quando não houver necessidade de estrutura persistente."
      evidence_refs: []
    - id: "RISK-02"
      scenario: "Conteúdo factual ainda não verificado usado em contexto de alta consequência."
      failure_mode: "A boa apresentação estrutural pode criar falsa sensação de confiabilidade."
      overkill_reason: "Estrutura editorial não substitui verificação factual, revisão especializada ou controles de domínio."
      better_alternative: "Validar fontes e conteúdo antes da transformação editorial."
      severity: "HIGH"
      likelihood: "CONTEXT_DEPENDENT"
      mitigation: "Separar validação factual de estruturação e exigir evidência quando o domínio for sensível."
      evidence_refs:
        - "EVIDENCIAS.md"
    - id: "RISK-03"
      scenario: "Projeto muito dinâmico em que a taxonomia muda mais rápido que o conteúdo pode ser mantido."
      failure_mode: "Manutenção da arquitetura passa a consumir tempo e gera dívida organizacional."
      overkill_reason: "Estrutura excessivamente rígida pode aumentar custo de atualização."
      better_alternative: "Usar estrutura mínima temporária e promover para arquitetura completa apenas após estabilização."
      severity: "MEDIUM"
      likelihood: "MEDIUM"
      mitigation: "Começar com estrutura mínima e ampliar somente quando o padrão de uso estiver claro."
      evidence_refs: []


