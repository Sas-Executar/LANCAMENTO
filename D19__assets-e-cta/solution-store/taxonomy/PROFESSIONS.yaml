  - id: "project_manager"
    label_pt_BR: "Gestor de Projetos"
    label_en: "Project Manager"
    entity_type: "profession"
    aliases: ["gerente de projetos", "project manager"]

rules:
  allow_multiple_professions_per_solution: true
  distinguish_primary_and_related: true
  require_use_case_or_rationale: true
  do_not_infer_regulated_professional_suitability_from_category_alone: true
  future_external_mapping:
    cbo: null
    isco: null
