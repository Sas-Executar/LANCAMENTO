    label_en: "Sales Professional"
    entity_type: "profession"
    aliases: ["vendedor", "executivo de vendas"]
  - id: "data_analyst"
    label_pt_BR: "Analista de Dados"
    label_en: "Data Analyst"
    entity_type: "profession"
    aliases: ["analytics"]
  - id: "hr_professional"
    label_pt_BR: "Profissional de RH"
    label_en: "Human Resources Professional"
