schema_version: "1.0"
registry_id: "SOLUTION_PROFESSIONS"
status: "canonical"
id_policy: "stable_english_snake_case"
external_codes_status: "future_mapping"

professions:
  - id: "lawyer"
    label_pt_BR: "Advogado"
    label_en: "Lawyer"
    entity_type: "profession"
    aliases: ["advocacia", "jurídico"]
  - id: "accountant"
    label_pt_BR: "Contador"
    label_en: "Accountant"
    entity_type: "profession"
