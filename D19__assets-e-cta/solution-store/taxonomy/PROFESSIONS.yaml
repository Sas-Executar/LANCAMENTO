  - id: "researcher"
    label_pt_BR: "Pesquisador"
    label_en: "Researcher"
    entity_type: "profession"
    aliases: ["pesquisa", "cientista"]
  - id: "designer"
    label_pt_BR: "Designer"
    label_en: "Designer"
    entity_type: "profession"
    aliases: ["design"]
  - id: "engineer"
    label_pt_BR: "Engenheiro"
    label_en: "Engineer"
    entity_type: "profession"
    aliases: ["engenharia"]
  - id: "software_developer"
    label_pt_BR: "Desenvolvedor"
    label_en: "Software Developer"
    entity_type: "profession"
    aliases: ["programador", "developer"]
  - id: "product_manager"
    label_pt_BR: "Gestor de Produto"
    label_en: "Product Manager"
    entity_type: "profession"
