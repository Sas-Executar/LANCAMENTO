name: Repository Governance

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    name: Validate governance and indexes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate governance
        run: python scripts/validate_governance.py

      - name: Validate generated indexes
        run: python scripts/sync_indexes.py --check
