ções complexas costumam esconder o mesmo padrão: dezenas de decisões pequenas, repetidas todos os dias, que ninguém parou para questionar. Automatizar não é sobre eliminar pessoas do processo — é sobre devolver o tempo delas para as decisões que realmente importam."},{type:"h2",text:"Onde a automação rende mais"},{type:"list",items:["Aprovações em série que dependem só de regras conhecidas (valor, prazo, categoria)","Consolidação de dados vindos de várias fontes antes de uma decisão humana","Notificações e cobranças de acompanhamento que hoje são manuais","Geração de relatórios recorrentes com o mesmo formato toda semana"]},{type:"callout",calloutType:"tip",title:"Comece pelo gargalo, não pela novidade",text:"O processo mais automatizável nem sempre é o mais visível. Priorize onde o time perde mais horas hoje — não onde a tecnologia é mais interessante de implementar."},{type:"p",text:"Em uma operação que acompanhamos, o time de suporte gastava em média 40 minutos por dia só copiando dados de um sistema para outro antes de conseguir responder o cliente. Depois de mapear o fluxo e automatizar a consolidação, esse tempo caiu para menos de 5 minutos — e a equipe passou a usar o tempo livre em atendimentos mais complexos, que realmente precisam de julgamento humano."},{type:"quote",text:"Não tentamos automatizar tudo de uma vez. Escolhemos o processo que mais doía, resolvemos ele, e usamos essa vitória para conseguir apoio para o próximo.",author:"Diretora de Operações, cliente EXECUTAR"},{type:"h2",text:"Um roteiro de quatro semanas"},{type:"list",items:["Semana 1 — mapear o processo como ele realmente acontece hoje, não como deveria acontecer","Semana 2 — identificar as regras de decisão que já são consistentes o suficiente para automatizar","Semana 3 — construir e testar a automação em paralelo ao processo manual","Semana 4 — migrar de vez, com um responsável acompanhando de perto os primeiros casos"]},{type:"callout",calloutType:"info",title:"Processos claros primeiro, automação depois",text:'Automatizar um processo confuso só multiplica a confusão mais rápido. Vale desenhar o fluxo primeiro — mesmo que isso pareça "trabalho extra" no começo.'}]},{slug:"ia-aumenta-produtividade-do-time",title:"Como a IA pode aumentar a produtividade do seu time",excerpt:"Veja exemplos práticos e ferramentas que já estão fazendo a diferença.",category:"ia",author:"Mariana Lopes",authorRole:"Head de Operações",readingTime:8,publishedAt:"2026-08-05",cover:"chart",body:[{type:"p",text:'A conversa sobre IA no trabalho costuma pular direto para "substituir" ou "não substituir" — e perde o meio-termo mais útil, que é onde a maioria dos times realmente ganha produtividade hoje: assistência no primeiro rascunho, busca em conhecimento disperso e resumo de informação longa.'},{type:"h2",text:"Três usos que já compensam o investimento"},{type:"list",items:["Resumir documentos longos antes de uma reunião de decisão",'Buscar respostas na base de conhecimento interna sem depender de quem "lembra onde está"',"Gerar o primeiro rascunho de comunicações repetitivas (respostas de suporte, atualizações de status)"]},{type:"callout",calloutType:"success",title:"O ganho aparece nas tarefas chatas, não nas criativas",text:"Times relatam mais produtividade eliminando o trabalho repetitivo de baixo valor do que tentando usar IA para as decisões mais estratégicas — essas continuam precisando de julgamento humano."},{type:"p",text:'Vale medir antes e depois: tempo médio para responder um ticket, tempo para preparar um relatório, número de vezes que alguém precisou perguntar "onde está isso mesmo?" no chat da equipe. Esses números tornam o ganho visível — e ajudam a decidir onde investir a próxima rodada de automação.'}]},{slug:"o-que-considerar-antes-de-implementar-ia",title:"O que considerar antes de implementar IA",excerpt:"Checklist prático para avaliar oportunidades e riscos na sua empresa.",category:"ia",author:"Rafael Costa",authorRole:"Engenheiro de Produto",readingTime:6,publishedAt:"2026-07-28",cover:"docs",body:[{type:"p",text:"Antes de escolher uma ferramenta, vale responder três perguntas simples — e a maioria dos projetos que travam depois pulou pelo menos uma delas."},{type:"h2",text:"A checklist"},{type:"list",items:["Os dados que a IA vai usar existem, estão atualizados e alguém é dono deles?","Existe um humano responsável por revisar o resultado antes que ele afete um cliente?","O time entende o suficiente da ferramenta para confiar (ou desconfiar) do resultado?"]},{type:"callout",calloutType:"warning",title:"Cuidado com o piloto sem dono",text:"Um piloto sem um responsável claro pelo resultado tende a nunca sair do piloto. Defina quem decide se o projeto continua, muda de direção ou é descontinuado."},{type:"p",text:"Nenhuma dessas perguntas é sobre a tecnologia em si — são sobre a organização ao redor dela. É aí que a maioria dos projetos de IA realmente falha ou dá certo."}]},{slug:"casos-reais-ia-na-operacao",title:"Casos reais: IA na operação",excerpt:"Três histórias de empresas que aplicaram IA e obtiveram resultados mensuráveis.",category:"casos-reais",author:"Ana Silva",authorRole:"Consultora de Implementação",readingTime:10,publishedAt:"2026-07-15",cover:"people",body:[{type:"h2",text:"Caso 1 — Suporte ao cliente"},{type:"p",text:"Uma operação de suporte com 12 pessoas reduziu o tempo médio de primeira resposta de 6 horas para 40 minutos usando um assistente que sugere respostas com base em tickets anteriores — sempre revisadas por um atendente antes de enviar."},{type:"h2",text:"Caso 2 — Financeiro"},{type:"p",text:"O time financeiro automatizou a conciliação de notas fiscais, que antes tomava dois dias inteiros de um analista por mês. Hoje o processo roda em background e o analista só revisa as exceções sinalizadas."},{type:"h2",text:"Caso 3 — Conteúdo"},{type:"p",text:"A equipe de conteúdo passou a usar IA para gerar o primeiro rascunho de posts de blog a partir de um briefing curto, cortando pela metade o tempo entre a pauta e a publicação — mantendo revisão editorial humana em 100% dos textos."},{type:"quote",text:"O que muda não é a quantidade de trabalho que desaparece, é a quantidade de trabalho chato que desaparece.",author:"Ana Silva, Consultora de Implementação"}]},{slug:"guia-implementar-automacao-4-semanas",title:"Guia prático para implementar automação em 4 semanas",excerpt:"Um plano passo a passo, sem depender de um time inteiro de engenharia.",category:"guias",author:"Ana Silva",authorRole:"Consultora de Implementação",readingTime:10,publishedAt:"2026-07-02",cover:"boxes",body:[{type:"p",text:"Este guia assume que você não tem um time de engenharia dedicado só para automação — a maioria das empresas não tem, e mesmo assim consegue resultado real em um mês."},{type:"h2",text:"Semana 1 — Diagnóstico"},{type:"p",text:'Escolha um único processo. Entreviste quem executa ele hoje. Escreva o passo a passo real, com as exceções incluídas — não a versão "ideal" do processo.'},{type:"h2",text:"Semana 2 — Desenho da solução"},{type:"p",text:"Separe o que é regra clara (automatizável) do que exige julgamento (mantém humano). Desenhe o fluxo novo com os dois lados explícitos."},{type:"h2",text:"Semana 3 — Construção"},{type:"p",text:"Construa a automação rodando em paralelo ao processo manual, sem desligar o antigo ainda. Compare os resultados dos dois lado a lado."},{type:"h2",text:"Semana 4 — Migração"},{type:"p",text:"Desligue o processo manual só depois que a automação bateu, por pelo menos uma semana inteira, o mesmo resultado que o processo antigo — com um responsável acompanhando de perto."},{type:"callout",calloutType:"tip",title:"Documente enquanto constrói",text:"A documentação escrita durante a construção é sempre mais precisa do que a escrita depois, de memória. Reserve 15 minutos por dia para isso."}]},{slug:"papel-das-pessoas-na-transformacao-digital",title:"O papel das pessoas na transformação digital",excerpt:"Tecnologia sozinha não muda uma empresa — cultura e pessoas, sim.",category:"cultura",author:"Lucas Mendes",authorRole:"Head de Pessoas",readingTime:7,publishedAt:"2026-06-20",cover:"people",body:[{type:"p",text:"É tentador tratar transformação digital como um projeto de tecnologia. Na prática, o maior preditor de sucesso não é a ferramenta escolhida — é se as pessoas que vão usá-la confiam no processo e entendem por que ele está mudando."},{type:"h2",text:"Três sinais de que a cultura está pronta"},{type:"list",items:["Erros no processo antigo são discutidos abertamente, não escondidos","Quem está mais perto do trabalho do dia a dia é ouvido antes da decisão, não só depois","Existe tempo protegido na agenda para aprender a nova forma de trabalhar"]},{type:"p",text:"Nenhuma automação sobrevive a uma cultura que pune quem aponta que ela não está funcionando. O ganho real vem de tratar cada ajuste como aprendizado esperado, não como falha do projeto."}]}],tA=tR.find(e=>e.featured)??tR[0],tM=tR.filter(e=>!e.featured),tO=[{id:"t1",title:"Revisar proposta do cliente",project:"ACME Corp.",status:"in_progress",dueLabel:"Hoje · 10:00",assignee:"João Silva",tag:"Comercial",description:"Revisar o documento com os ajustes solicitados pelo cliente e preparar a versão final para envio.",file:{name:"proposta-acme-v3.pdf",size:"2,4 MB"},checklist:[{id:"c1",label:"Revisar escopo e valores",done:!0},{id:"c2",label:"Validar com o jurídico",done:!0},{id:"c3",label:"Incluir case de sucesso",done:!1},{id:"c4",label:"Enviar versão final",done:!1}]},{id:"t2",title:"Preparar apresentação",project:"Produto",status:"todo",dueLabel:"Hoje · 14:00",assignee:"Você",tag:"Produto",description:"Montar slides para a reunião de alinhamento trimestral com a liderança.",checklist:[{id:"c1",label:"Coletar números do trimestre",done:!1},{id:"c2",label:"Montar rascunho dos slides",done:!1}]},{id:"t3",title:"Analisar feedback do time",project:"Crescimento",status:"todo",dueLabel:"Amanhã",assignee:"Você",tag:"Pesquisa",description:"Consolidar a
